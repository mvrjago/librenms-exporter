<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Login - MVR Exporter</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="min-h-screen flex items-center justify-center bg-black text-green-500 dark:bg-white dark:text-black font-mono">

    <div class="w-full max-w-md border-2 border-green-500 p-8 rounded-md shadow-lg dark:border-gray-700 dark:shadow-gray-400">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold">[ LOGIN ]</h2>
            <button id="toggle-theme"
                class="w-10 h-10 flex items-center justify-center rounded-full border border-green-500 dark:border-gray-600 hover:bg-green-100 dark:hover:bg-gray-800 transition duration-300"
                title="Toggle Dark/Light Mode">
                <span id="theme-icon" class="text-xl">🕯️</span>
            </button>
	</div>

        <form method="POST" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium">Username</label>
                <input type="text" name="username" id="username" required
                    class="mt-1 block w-full rounded px-2 py-1 bg-black text-green-500 border border-green-500 focus:outline-none focus:bg-gray-900 dark:bg-white dark:text-black dark:border-gray-400 dark:focus:bg-gray-200">
            </div>

            <div>
                <label for="password" class="block text-sm font-medium">Password</label>
                <input type="password" name="password" id="password" required
                    class="mt-1 block w-full rounded px-2 py-1 bg-black text-green-500 border border-green-500 focus:outline-none focus:bg-gray-900 dark:bg-white dark:text-black dark:border-gray-400 dark:focus:bg-gray-200">
            </div>

            <button type="submit"
                class="w-full py-2 rounded font-bold tracking-widest bg-black text-green-500 border border-green-500 hover:bg-gray-900 dark:bg-white dark:text-black dark:border-gray-600 dark:hover:bg-gray-100">
                ENTER
            </button>
        </form>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="mt-4">
                {% for category, message in messages %}
                    <div class="text-sm text-{{ 'red' if category == 'danger' else 'yellow' }}-600 dark:text-{{ 'red' if category == 'danger' else 'yellow' }}-700">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
        {% endwith %}
    </div>

    <script>
        const toggleBtn = document.getElementById('toggle-theme');
        const icon = document.getElementById('theme-icon');

        toggleBtn.addEventListener('click', () => {
            const root = document.documentElement;
            const isDark = root.classList.toggle('dark');
            icon.textContent = isDark ? '🕯️' : '💡';
        });
    </script>

</body>
</html>
